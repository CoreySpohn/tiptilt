[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "tiptilt"
dynamic = ["version"]
description = "Differentiable wavefront-error generation and wavefront control for the HWO direct imaging simulation suite"
authors = [{ name = "Corey Spohn", email = "corey.a.spohn@nasa.gov" }]
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "astropy",
    "equinox>=0.12.0",
    "jax>=0.4.1",
    "jaxlib>=0.4.1",
    "jaxtyping",
    "numpy",
    "optixstuff>=1.5.0",
    "physicaloptix>=0.2.0",
]

[project.optional-dependencies]
dev = ["pre-commit"]
test = [
    "pytest",
    "hypothesis",
    "pytest-cov",
    "pytest-xdist",
    "pytest-testmon",
    "pytest-markdown-docs",
    "pytest-timeout",
    "pytest-fail-slow",
    "hwoutils",
]
docs = ["sphinx", "myst-nb", "sphinx-autoapi", "sphinx-book-theme"]

[tool.pytest.ini_options]
filterwarnings = [
    "error",
    # JAX 0.8.x casts complex cotangents to real in mixed-type dot transposes.
    'ignore:^Casting complex values to real discards the imaginary part$:numpy.exceptions.ComplexWarning:jax\._src\.lax\.lax$',
]
markers = [
    "medium: tests with a 30-second default time budget",
    "slow: multi-step control-loop convergence (physics regression, seconds each)",
]

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "UP", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/tiptilt/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tiptilt"]

[dependency-groups]
dev = [
    "pytest-xdist>=3.8.0",
]

[tool.testbudget]
library = "tiptilt"
mode = "report"
unit_s = 5
medium_s = 30
slow_s = 300

[tool.deptry]
known_first_party = ["tiptilt"]
optional_dependencies_dev_groups = ["dev", "docs", "test"]

[tool.deptry.per_rule_ignores]
# JAX loads its compiled backend; keep the explicit minimum version constraint.
DEP002 = ["jaxlib"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src/tiptilt"]
